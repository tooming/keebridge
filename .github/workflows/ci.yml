name: ci

# The only gate this repo has: swift test (KeeBridgeCore, no signing needed) + an
# unsigned xcodebuild build (KeeBridge, embeds both extensions) + a swift build
# of VaultProbe (its own SPM package, not part of the Xcode project) + the
# routines/ drift checks + their own bats unit tests (tests/drift-detectors.bats).
# Runs on macos-latest since swift/xcodebuild need a real macOS toolchain — there's
# no clusterless/Linux-only split like the sibling repos, this whole repo is
# macOS-only.
#
# bats-core install: `command -v bats ||` guards against erroring if a future
# macos-latest image ships it preinstalled (Homebrew's `install` on an
# already-installed formula warns but doesn't fail either way — the guard just
# avoids the wasted install time on every run if it's ever preinstalled).
#
# `push` is scoped to main only; `pull_request` already covers every branch's PR
# (opened/synchronize/reopened, including rebase pushes) — see tooming/k8s-anywhere's
# ci.yml for the fuller rationale on why that avoids doubled runs.
#
# fetch-depth: 0 (full history): routines-author-check.sh derives the merge-base
# with main and the commit author to decide whether an executor-authored (auto/*)
# change edited routines.yaml — a shallow clone can't do that.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Package.resolved pins exact dependency revisions, so a stale/partial
      # restore here only ever costs a cache miss (falls back through
      # restore-keys or a clean build) — never a wrong/incompatible build.
      - name: Cache SPM build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            KeeBridgeCore/.build
            VaultProbe/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      # Low-value but harmless: speeds up the "Install bats-core" step below
      # on a cache hit; on a miss it just falls through to brew install as
      # today.
      - name: Cache Homebrew (bats-core)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-bats-core
          restore-keys: |
            ${{ runner.os }}-brew-
      # Not restored/saved on a hash miss the way the SPM cache above is -
      # Xcode's own incremental build system (module cache, build
      # description, indexing) is what actually reuses a restore-keys
      # fallback hit partially, which is the whole point of caching
      # DerivedData at all (an exact hashFiles match on real,
      # actively-edited sources is rare in practice). That's also the
      # known risk flagged in #162: reusing DerivedData across unrelated
      # commits has occasionally produced stale/incorrect incremental
      # Xcode builds. Mitigated here by being an UNSIGNED build
      # (CODE_SIGNING_ALLOWED=NO in the Makefile) with its own real `make
      # test`/`make build` outcome as the actual correctness gate - a
      # flaky incremental build fails the job outright rather than
      # silently shipping something wrong, so this is a CI-speed bet, not
      # a correctness risk to production (no signed artifact is ever
      # produced from this path).
      - name: Cache Xcode DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('KeeBridge.xcodeproj/project.pbxproj', 'KeeBridge/**/*.swift', 'KeeBridgeCardExtension/**/*.swift', 'KeeBridgeProvider/**/*.swift', 'KeeBridgeCore/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-
      - name: Fetch main for drift comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
      - name: Install bats-core
        run: command -v bats || brew install bats-core
      - run: make test
      - run: make build DERIVED_DATA_PATH=DerivedData
      - run: make probe-build
      - run: make routines-check
      - run: make routines-author-check
      - run: make routines-bats-test
